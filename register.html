<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - BURNING ZERO</title>
<script src="i18n.js" onerror="window.t=function(k){return k};window.setLang=function(){};window.renderLangPicker=function(){return ''};window.currentLang='en';"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Segoe UI', sans-serif;
  background: #0a0a14;
  color: #e0e0e0;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 0;
}
a { text-decoration: none; color: inherit; }

.auth-container { width: 100%; max-width: 480px; padding: 16px; }
.auth-logo { text-align: center; margin-bottom: 28px; }
.auth-logo a {
  font-size: 24px; font-weight: 900; letter-spacing: 2px;
  background: linear-gradient(135deg, #ff4444, #ff8800);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.auth-card {
  background: #12121e; border: 1px solid #1e1e30;
  border-radius: 16px; padding: 32px 24px;
}
.auth-title {
  font-size: 22px; font-weight: 800; text-align: center;
  margin-bottom: 8px; color: #fff;
}
.auth-subtitle {
  text-align: center; font-size: 13px; color: #666;
  margin-bottom: 24px; line-height: 1.5;
}
.form-section {
  font-size: 12px; font-weight: 700; color: #ff6644;
  text-transform: uppercase; letter-spacing: 1px;
  margin: 20px 0 12px; padding-bottom: 6px;
  border-bottom: 1px solid #1e1e30;
}
.form-group { margin-bottom: 14px; }
.form-label {
  display: block; font-size: 13px; font-weight: 600;
  color: #888; margin-bottom: 5px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.form-input {
  width: 100%; padding: 11px 14px;
  background: #0e0e1a; border: 1px solid #2a2a3e;
  border-radius: 10px; color: #e0e0e0; font-size: 14px;
  outline: none; transition: border-color 0.2s;
}
.form-input:focus { border-color: #ff6644; }
.form-input::placeholder { color: #444; }
.form-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.btn-primary {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, #ff4444, #ff6600);
  color: #fff; font-size: 16px; font-weight: 700;
  border: none; border-radius: 12px; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 24px rgba(255, 68, 68, 0.3);
  margin-top: 12px;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 32px rgba(255,68,68,0.4); }
.btn-primary:active { transform: scale(0.97); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.auth-footer {
  text-align: center; margin-top: 20px;
  font-size: 14px; color: #666;
}
.auth-footer a { color: #ff6644; font-weight: 600; }
.auth-footer a:hover { text-decoration: underline; }
.error-msg {
  background: #2a1015; border: 1px solid #ff4444;
  border-radius: 8px; padding: 10px 14px; font-size: 13px;
  color: #ff6666; margin-bottom: 16px; display: none;
}
.info-box {
  background: #0e1a1e; border: 1px solid #1a3a3a;
  border-radius: 8px; padding: 10px 14px; font-size: 12px;
  color: #6ab; margin-bottom: 16px; line-height: 1.5;
}
@media (max-width: 500px) {
  .form-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="auth-container">
  <div class="auth-logo"><a href="/">BURNING ZERO</a></div>

  <div class="auth-card">
    <h1 class="auth-title" data-i18n="register">Sign Up</h1>
    <p class="auth-subtitle">Join BURNING ZERO and start automated gold trading.</p>

    <div class="error-msg" id="error"></div>

    <div class="info-box">
      You need an <a href="https://one.exnessonelink.com/a/71hmw54ihe?source=app" target="_blank" style="color:#ff6644;font-weight:700">Exness account</a> opened through our partner link. Your MT5 credentials are encrypted and used only for trade execution.
    </div>

    <form id="register-form" onsubmit="return handleRegister(event)">
      <div class="form-section">Account</div>
      <div class="form-group">
        <label class="form-label">Name</label>
        <input type="text" class="form-input" id="name" required placeholder="Your name">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" data-i18n="email">Email</label>
          <input type="email" class="form-input" id="email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="password">Password</label>
          <input type="password" class="form-input" id="password" required minlength="6" placeholder="Min 6 chars" autocomplete="new-password">
        </div>
      </div>

      <div class="form-section">MT5 Account</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" data-i18n="mt5_account">Account Number</label>
          <input type="number" class="form-input" id="mt5_login" required placeholder="12345678">
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="mt5_server">MT5 Server</label>
          <input type="text" class="form-input" id="mt5_server" required placeholder="Exness-MT5Real">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">MT5 Password</label>
        <input type="password" class="form-input" id="mt5_password" required placeholder="Your MT5 trading password">
      </div>

      <button type="submit" class="btn-primary" id="submit-btn" data-i18n="register">Sign Up</button>
    </form>

    <div class="auth-footer">
      <span>Already have an account? </span>
      <a href="/login" data-i18n="login">Login</a>
    </div>
  </div>
</div>

<script>
if (localStorage.getItem('bz_token')) {
  window.location.href = '/dashboard';
}

async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('error');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = '...';

  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        mt5_login: parseInt(document.getElementById('mt5_login').value),
        mt5_server: document.getElementById('mt5_server').value,
        mt5_password: document.getElementById('mt5_password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Registration failed');
    localStorage.setItem('bz_token', data.token);
    window.location.href = '/dashboard';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign Up';
  }
}
</script>

</body>
</html>
